<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>The Chanakyas — Road Scan</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0a0c0f;
    --panel: #111318;
    --border: #1e2530;
    --accent: #00e5ff;
    --warn: #ff6b00;
    --danger: #ff1744;
    --good: #00e676;
    --text: #c8d8e8;
    --dim: #4a5568;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,229,255,0.015) 2px,
      rgba(0,229,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  header {
    width: 100%;
    padding: 14px 20px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }

  header span {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* URL Input Section */
  .url-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  .url-section label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .url-row {
    display: flex;
    gap: 8px;
  }

  .url-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .url-row input:focus {
    border-color: var(--accent);
  }

  .url-row input::placeholder {
    color: var(--dim);
  }

  /* Buttons */
  .btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover, .btn:active {
    background: var(--accent);
    color: var(--bg);
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Status bar */
  #statusBar {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #statusBar.loading { color: var(--accent); }
  #statusBar.error   { color: var(--danger); border-color: var(--danger); }
  #statusBar.ready   { color: var(--good);   border-color: var(--good); }

  /* Camera feed */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    display: none;
  }

  .camera-wrap.visible { display: block; }

  #webcam-container {
    width: 100%;
    height: 100%;
  }

  #webcam-container canvas,
  #webcam-container video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    display: block;
  }

  /* HUD corners */
  .hud-corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0.6;
  }
  .hud-corner.tl { top: 8px; left: 8px;  border-width: 2px 0 0 2px; }
  .hud-corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .hud-corner.bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; }
  .hud-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  /* Scan line animation */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    from { top: 0; }
    to   { top: 100%; }
  }

  /* Result panel */
  #result-panel {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    gap: 14px;
    flex-direction: column;
  }

  #result-panel.visible {
    display: flex;
  }

  .result-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-tag {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
  }

  #top-label {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  #confidence-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    font-weight: 400;
  }

  /* Condition bar */
  .bar-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bar-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar-name {
    width: 110px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--dim);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.2s ease;
  }

  .bar-pct {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    width: 38px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Alert badge */
  #alert-badge {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255, 23, 68, 0.1);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: blink-border 1s infinite;
  }

  #alert-badge.show { display: flex; }

  @keyframes blink-border {
    0%, 100% { border-color: var(--danger); }
    50% { border-color: transparent; }
  }

  .alert-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
    animation: pulse 0.8s infinite;
    flex-shrink: 0;
  }

  /* Stop button */
  .btn-stop {
    border-color: var(--danger);
    color: var(--danger);
  }
  .btn-stop:hover, .btn-stop:active {
    background: var(--danger);
    color: #fff;
  }

  .control-row {
    display: flex;
    gap: 10px;
  }

  .control-row .btn { flex: 1; }

  /* ── Team Banner ── */
  .team-banner {
    width: 100%;
    padding: 22px 20px 18px;
    background: linear-gradient(135deg, #0a0c0f 0%, #0d1117 60%, #0a1628 100%);
    border-bottom: 1px solid rgba(0,229,255,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }

  .team-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 50% 120%, rgba(0,229,255,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .team-name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #00e5ff 0%, #ffffff 50%, #00e5ff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    text-shadow: none;
    position: relative;
    z-index: 1;
  }

  @keyframes shine {
    from { background-position: 0% center; }
    to   { background-position: 200% center; }
  }

  .team-tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }

  .team-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin-top: 4px;
  }

  footer {
    margin-top: auto;
    padding: 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="team-banner">
  <div class="team-name">The Chanakyas</div>
  <div class="team-line"></div>
  <div class="team-tagline">Road Condition Detection System</div>
</div>

<header>
  <div class="logo-dot"></div>
  <h1>Road Scan</h1>
  <span id="clock">--:--:--</span>
</header>

<div class="main">

  <!-- Model URL hidden — pre-filled -->
  <div style="display:none">
    <input type="url" id="modelURL"
      value="https://teachablemachine.withgoogle.com/models/0OGLfbe5V/"
      autocomplete="off" autocorrect="off" spellcheck="false" />
  </div>

  <!-- Status -->
  <div id="statusBar">⬡ &nbsp;Ready — tap START to begin detection</div>

  <!-- Start / Stop -->
  <div class="control-row">
    <button class="btn" id="startBtn" onclick="init()">▶ Start</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopDetection()" disabled>■ Stop</button>
  </div>

  <!-- Camera -->
  <div class="camera-wrap" id="cameraWrap">
    <div id="webcam-container"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="scan-line"></div>
  </div>

  <!-- Results -->
  <div id="result-panel">
    <div class="result-label-row">
      <div>
        <div class="result-tag">Detected Condition</div>
        <div id="top-label">—</div>
      </div>
      <div id="confidence-badge" style="color: var(--accent)">—</div>
    </div>

    <div id="alert-badge">
      <div class="alert-dot"></div>
      ⚠ POTHOLE DETECTED
    </div>

    <div class="bar-row" id="label-bars"></div>
  </div>

</div>

<footer>THE CHANAKYAS · ROAD CONDITION DETECTION SYSTEM</footer>

<script>
  // ── Clock ──────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-IN', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── State ──────────────────────────────────────────────
  let model, webcam, maxPredictions;
  let running = false;
  let animFrame;

  const POTHOLE_KEYWORDS = ['pothole', 'damaged', 'bad', 'crack', 'broken', 'hole', 'rough'];

  function isPothole(label) {
    const l = label.toLowerCase();
    return POTHOLE_KEYWORDS.some(k => l.includes(k));
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('statusBar');
    el.className = type;
    el.innerHTML = msg;
  }

  // ── Init ───────────────────────────────────────────────
  async function init() {
    const urlInput = document.getElementById('modelURL').value.trim();

    if (!urlInput) {
      setStatus('⚠ &nbsp;Please check your configuration and try again.', 'error');
      return;
    }

    // Ensure trailing slash
    const modelURL = urlInput.endsWith('/') ? urlInput : urlInput + '/';
    const modelFile = modelURL + 'model.json';
    const metaFile  = modelURL + 'metadata.json';

    document.getElementById('startBtn').disabled = true;
    setStatus('⏳ &nbsp;Loading model…', 'loading');

    try {
      model = await tmImage.load(modelFile, metaFile);
      maxPredictions = model.getTotalClasses();
    } catch (e) {
      console.error('Model load error:', e);
      setStatus('✖ &nbsp;Model load failed: ' + (e.message || 'Check URL & internet'), 'error');
      document.getElementById('startBtn').disabled = false;
      return;
    }

    setStatus('📷 &nbsp;Starting rear camera…', 'loading');

    try {
      // tmImage.Webcam: (width, height, flip)
      // flip=false so rear camera is NOT mirrored
      webcam = new tmImage.Webcam(640, 480, false);
      // Pass facingMode via constraints
      await webcam.setup({ facingMode: { ideal: 'environment' } });
      await webcam.play();

      const container = document.getElementById('webcam-container');
      container.innerHTML = '';
      container.appendChild(webcam.canvas);

    } catch (e) {
      console.error('Camera error:', e);
      setStatus('✖ &nbsp;Camera error: ' + (e.message || 'Allow camera permission'), 'error');
      document.getElementById('startBtn').disabled = false;
      return;
    }

    // Build bar UI
    buildBars(maxPredictions);

    document.getElementById('cameraWrap').classList.add('visible');
    document.getElementById('result-panel').classList.add('visible');
    document.getElementById('stopBtn').disabled = false;

    setStatus('✔ &nbsp;Running — point camera at the road', 'ready');
    running = true;
    loop();
  }

  // ── Build label bars ───────────────────────────────────
  function buildBars(count) {
    const container = document.getElementById('label-bars');
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      container.innerHTML += `
        <div class="bar-item">
          <div class="bar-name" id="bar-name-${i}">CLASS ${i}</div>
          <div class="bar-track"><div class="bar-fill" id="bar-fill-${i}" style="width:0%"></div></div>
          <div class="bar-pct" id="bar-pct-${i}">0%</div>
        </div>`;
    }
  }

  // ── Prediction loop ────────────────────────────────────
  async function loop() {
    if (!running) return;
    webcam.update();
    await predict();
    animFrame = requestAnimationFrame(loop);
  }

  async function predict() {
    const predictions = await model.predict(webcam.canvas);

    // Find top class
    let top = predictions[0];
    for (const p of predictions) {
      if (p.probability > top.probability) top = p;
    }

    // Update top label
    const labelEl = document.getElementById('top-label');
    const confEl  = document.getElementById('confidence-badge');
    labelEl.textContent = top.className.toUpperCase();
    confEl.textContent  = (top.probability * 100).toFixed(1) + '%';

    // Color based on condition
    if (isPothole(top.className)) {
      labelEl.style.color = 'var(--danger)';
      confEl.style.color  = 'var(--danger)';
      document.getElementById('alert-badge').classList.add('show');
    } else {
      labelEl.style.color = 'var(--good)';
      confEl.style.color  = 'var(--accent)';
      document.getElementById('alert-badge').classList.remove('show');
    }

    // Update bars
    predictions.forEach((p, i) => {
      const nameEl = document.getElementById(`bar-name-${i}`);
      const fillEl = document.getElementById(`bar-fill-${i}`);
      const pctEl  = document.getElementById(`bar-pct-${i}`);
      if (!nameEl) return;
      nameEl.textContent = p.className;
      const pct = (p.probability * 100).toFixed(1);
      fillEl.style.width = pct + '%';
      pctEl.textContent  = pct + '%';

      // Color active bar
      if (isPothole(p.className)) {
        fillEl.style.background = 'var(--danger)';
      } else {
        fillEl.style.background = p.className === top.className
          ? 'var(--good)' : 'var(--accent)';
      }
    });
  }

  // ── Stop ───────────────────────────────────────────────
  function stopDetection() {
    running = false;
    cancelAnimationFrame(animFrame);
    if (webcam) webcam.stop();
    document.getElementById('cameraWrap').classList.remove('visible');
    document.getElementById('result-panel').classList.remove('visible');
    document.getElementById('alert-badge').classList.remove('show');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    setStatus('⬡ &nbsp;Detection stopped. Tap START to run again.');
  }
</script>
</body>
</html>
